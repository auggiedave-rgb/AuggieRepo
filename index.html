<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Visual Odometry</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121923; --line: #223041; --text: #dbe6f1; --dim: #7d90a5;
    --acc: #6ee7a8; --warn: #ffb454; --bad: #ff6b6b;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 14px 8px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #status { font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: right; }
  #status.ok { color: var(--acc); } #status.warn { color: var(--warn); } #status.bad { color: var(--bad); }
  main { flex: 1; display: grid; gap: 8px; padding: 0 8px 8px; grid-template-rows: auto minmax(180px, 1fr); min-height: 0; }
  @media (orientation: landscape) { main { grid-template-rows: 1fr; grid-template-columns: 1fr 1fr; } }
  .pane { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 0; }
  #view { display: block; width: 100%; height: auto; max-height: 46dvh; object-fit: contain; background: #000; }
  @media (orientation: landscape) { #view { max-height: none; height: 100%; } }
  #map { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 8px; top: 6px; font: 11px/1.5 var(--mono); color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: pre; pointer-events: none; }
  .seg { position: absolute; right: 8px; top: 8px; display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 10px; font-size: 12px; background: transparent; color: var(--dim); min-height: 0; }
  .seg button.on { background: var(--line); color: var(--text); }
  .label { position: absolute; left: 10px; top: 8px; font: 11px var(--mono); color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  dl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; margin: 0 8px 8px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  dl div { background: var(--panel); padding: 6px 8px; min-width: 0; }
  dt { font-size: 10px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
  dd { margin: 0; font: 15px var(--mono); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 8px 10px; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #06210f; font-weight: 600; flex: 1; }
  button.primary.stop { background: transparent; color: var(--bad); border-color: var(--bad); }
  label.fov { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-left: auto; }
  label.fov input { width: 58px; font: 14px var(--mono); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 6px; text-align: center; }
  video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Visual Odometry</h1>
  <span id="status">Carico OpenCV…</span>
</header>

<main>
  <section class="pane">
    <canvas id="view" width="480" height="360"></canvas>
    <div class="hud" id="hud"></div>
  </section>
  <section class="pane">
    <canvas id="map"></canvas>
    <span class="label" id="mapLabel">Traiettoria · dall'alto (X–Z)</span>
    <div class="seg">
      <button id="vTop" class="on" type="button">Alto</button>
      <button id="vSide" type="button">Lato</button>
    </div>
  </section>
</main>

<dl>
  <div><dt>X</dt><dd id="sx">0.00</dd></div>
  <div><dt>Y</dt><dd id="sy">0.00</dd></div>
  <div><dt>Z</dt><dd id="sz">0.00</dd></div>
  <div><dt>Percorso</dt><dd id="sd">0.00</dd></div>
  <div><dt>Keyframe</dt><dd id="sk">0</dd></div>
</dl>

<footer>
  <button id="btnStart" class="primary" type="button" disabled>Avvia camera</button>
  <button id="btnReset" type="button" disabled>Azzera</button>
  <button id="btnCsv" type="button" disabled>CSV</button>
  <label class="fov">FOV°<input id="fov" type="number" inputmode="decimal" min="30" max="120" step="1" value="65"></label>
</footer>

<video id="video" playsinline muted autoplay></video>

<!-- =====================================================================
     1) NUCLEO MATEMATICO (nessuna dipendenza): matrice essenziale con
        8 punti + RANSAC, decomposizione in R,t, triangolazione, scala.
     ===================================================================== -->
<script>
/*VO-CORE-BEGIN*/
const VOCore = (() => {
  // --- algebra 3x3 (matrici row-major in array da 9) ---
  const mul3 = (A, B) => {
    const C = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
      C[i*3+j] = A[i*3]*B[j] + A[i*3+1]*B[3+j] + A[i*3+2]*B[6+j];
    return C;
  };
  const T3 = A => [A[0],A[3],A[6], A[1],A[4],A[7], A[2],A[5],A[8]];
  const mv = (A, v) => [A[0]*v[0]+A[1]*v[1]+A[2]*v[2], A[3]*v[0]+A[4]*v[1]+A[5]*v[2], A[6]*v[0]+A[7]*v[1]+A[8]*v[2]];
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const norm = a => Math.hypot(a[0], a[1], a[2]);
  const unit = a => { const n = norm(a) || 1; return [a[0]/n, a[1]/n, a[2]/n]; };

  // Autovalori/autovettori di una matrice simmetrica n×n (Jacobi ciclico).
  // Modifica `a` (sulla diagonale restano gli autovalori), ritorna V (colonne = autovettori).
  function jacobi(a, n) {
    const v = new Float64Array(n * n);
    for (let i = 0; i < n; i++) v[i*n+i] = 1;
    let tr = 0; for (let i = 0; i < n; i++) tr += a[i*n+i] * a[i*n+i];
    for (let sweep = 0; sweep < 50; sweep++) {
      let off = 0;
      for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) off += a[p*n+q] * a[p*n+q];
      if (off <= 1e-26 * tr + 1e-300) break;
      for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) {
        const apq = a[p*n+q];
        if (Math.abs(apq) < 1e-300) continue;
        const th = (a[q*n+q] - a[p*n+p]) / (2 * apq);
        const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th*th + 1));
        const c = 1 / Math.sqrt(t*t + 1), s = t * c;
        for (let k = 0; k < n; k++) {
          const akp = a[k*n+p], akq = a[k*n+q];
          a[k*n+p] = c*akp - s*akq; a[k*n+q] = s*akp + c*akq;
        }
        for (let k = 0; k < n; k++) {
          const apk = a[p*n+k], aqk = a[q*n+k];
          a[p*n+k] = c*apk - s*aqk; a[q*n+k] = s*apk + c*aqk;
        }
        for (let k = 0; k < n; k++) {
          const vkp = v[k*n+p], vkq = v[k*n+q];
          v[k*n+p] = c*vkp - s*vkq; v[k*n+q] = s*vkp + c*vkq;
        }
      }
    }
    return v;
  }

  // SVD 3x3 "quanto basta" per una matrice essenziale: ritorna U e V (det = +1)
  // tali che E ≈ U·diag(s1,s2,0)·Vᵀ.
  function svd3(E) {
    const M = new Float64Array(mul3(T3(E), E));
    const V = jacobi(M, 3);
    const ord = [0, 1, 2].sort((i, j) => M[j*3+j] - M[i*3+i]);
    const col = k => [V[k], V[3+k], V[6+k]];
    const v1 = unit(col(ord[0]));
    let v2 = col(ord[1]); const d = dot(v2, v1); v2 = unit([v2[0]-d*v1[0], v2[1]-d*v1[1], v2[2]-d*v1[2]]);
    const v3 = cross(v1, v2);
    const u1 = unit(mv(E, v1));
    let u2 = mv(E, v2); const e = dot(u2, u1); u2 = unit([u2[0]-e*u1[0], u2[1]-e*u1[1], u2[2]-e*u1[2]]);
    const u3 = cross(u1, u2);
    return {
      U: [u1[0],u2[0],u3[0], u1[1],u2[1],u3[1], u1[2],u2[2],u3[2]],
      V: [v1[0],v2[0],v3[0], v1[1],v2[1],v3[1], v1[2],v2[2],v3[2]],
    };
  }

  // Algoritmo degli 8 punti: x2ᵀ·E·x1 = 0 per ogni corrispondenza (coordinate normalizzate).
  // x1,x2: array [x0,y0,x1,y1,…]; idx: indici dei punti da usare.
  const _AtA = new Float64Array(81), _r = new Float64Array(9);
  function fitE(x1, x2, idx, m) {
    _AtA.fill(0);
    for (let k = 0; k < m; k++) {
      const i = idx[k], a = x1[2*i], b = x1[2*i+1], c = x2[2*i], d = x2[2*i+1];
      _r[0]=c*a; _r[1]=c*b; _r[2]=c; _r[3]=d*a; _r[4]=d*b; _r[5]=d; _r[6]=a; _r[7]=b; _r[8]=1;
      for (let p = 0; p < 9; p++) { const rp = _r[p]; for (let q = p; q < 9; q++) _AtA[p*9+q] += rp * _r[q]; }
    }
    for (let p = 0; p < 9; p++) for (let q = 0; q < p; q++) _AtA[p*9+q] = _AtA[q*9+p];
    const V = jacobi(_AtA, 9);
    let best = 0; for (let k = 1; k < 9; k++) if (_AtA[k*9+k] < _AtA[best*9+best]) best = k;
    const E = new Array(9); for (let k = 0; k < 9; k++) E[k] = V[k*9+best];
    return E;
  }

  // Distanza di Sampson al quadrato (errore geometrico del vincolo epipolare).
  function sampson(E, a, b, c, d) {
    const l0 = E[0]*a + E[1]*b + E[2], l1 = E[3]*a + E[4]*b + E[5], l2 = E[6]*a + E[7]*b + E[8];
    const m0 = E[0]*c + E[3]*d + E[6], m1 = E[1]*c + E[4]*d + E[7];
    const e = c*l0 + d*l1 + l2;
    return e*e / (l0*l0 + l1*l1 + m0*m0 + m1*m1 + 1e-300);
  }

  function ransacE(x1, x2, n, thr2, maxIter) {
    let bestCnt = 0, bestE = null, iters = maxIter;
    const s = new Int32Array(8);
    for (let it = 0; it < iters; it++) {
      for (let k = 0; k < 8; k++) {
        let r, dup;
        do { r = (Math.random() * n) | 0; dup = false; for (let j = 0; j < k; j++) if (s[j] === r) dup = true; } while (dup);
        s[k] = r;
      }
      const E = fitE(x1, x2, s, 8);
      let cnt = 0;
      for (let i = 0; i < n; i++) if (sampson(E, x1[2*i], x1[2*i+1], x2[2*i], x2[2*i+1]) < thr2) cnt++;
      if (cnt > bestCnt) {
        bestCnt = cnt; bestE = E;
        const w = cnt / n;
        iters = Math.min(maxIter, Math.ceil(Math.log(1e-3) / Math.log(1 - Math.pow(w, 8) + 1e-12)));
      }
    }
    if (!bestE) return null;
    // Rifinitura: ristima su tutti gli inlier, proiezione su matrice essenziale, riconteggio.
    let E = bestE;
    const idx = new Int32Array(n), mask = new Uint8Array(n);
    for (let pass = 0; pass < 2; pass++) {
      let m = 0;
      for (let i = 0; i < n; i++) if (sampson(E, x1[2*i], x1[2*i+1], x2[2*i], x2[2*i+1]) < thr2) idx[m++] = i;
      if (m < 8) return null;
      const { U, V } = svd3(fitE(x1, x2, idx, m));
      E = mul3(mul3(U, [1,0,0, 0,1,0, 0,0,0]), T3(V));
    }
    let cnt = 0;
    for (let i = 0; i < n; i++) { mask[i] = sampson(E, x1[2*i], x1[2*i+1], x2[2*i], x2[2*i+1]) < thr2 ? 1 : 0; cnt += mask[i]; }
    return { E, mask, count: cnt };
  }

  // Profondità (coordinata Z) di un punto nelle due camere, dato X2 = R·X1 + t.
  function depths(R, t, a, b, c, d, out) {
    const p = [R[0]*a + R[1]*b + R[2], R[3]*a + R[4]*b + R[5], R[6]*a + R[7]*b + R[8]];
    const aa = dot(p, p), bb = c*c + d*d + 1, ab = p[0]*c + p[1]*d + p[2];
    const at = dot(p, t), bt = c*t[0] + d*t[1] + t[2];
    const det = aa*bb - ab*ab;
    if (det < 1e-12) { out[0] = out[1] = NaN; return; }
    out[0] = (-at*bb + ab*bt) / det;
    out[1] = (-ab*at + aa*bt) / det;
  }

  const median = (arr, q = 0.5) => {
    if (!arr.length) return NaN;
    const s = Float64Array.from(arr).sort();
    return s[Math.min(s.length - 1, Math.floor(q * s.length))];
  };

  // Angolo residuo (gradi) tra i raggi dopo aver compensato la sola rotazione:
  // se è ~0 il moto è (quasi) rotazione pura e la traslazione non è osservabile.
  function rotResidualDeg(R, x1, x2, mask, n) {
    const ang = [];
    for (let i = 0; i < n; i++) if (mask[i]) {
      const a = x1[2*i], b = x1[2*i+1], c = x2[2*i], d = x2[2*i+1];
      const p = [R[0]*a + R[1]*b + R[2], R[3]*a + R[4]*b + R[5], R[6]*a + R[7]*b + R[8]];
      const cs = (p[0]*c + p[1]*d + p[2]) / (norm(p) * Math.hypot(c, d, 1));
      ang.push(Math.acos(Math.min(1, Math.max(-1, cs))) * 180 / Math.PI);
    }
    return median(ang, 0.8);
  }

  function quat(R) {
    const tr = R[0] + R[4] + R[8];
    let w, x, y, z;
    if (tr > 0) { const s = Math.sqrt(tr + 1) * 2; w = s/4; x = (R[7]-R[5])/s; y = (R[2]-R[6])/s; z = (R[3]-R[1])/s; }
    else if (R[0] > R[4] && R[0] > R[8]) { const s = Math.sqrt(1 + R[0] - R[4] - R[8]) * 2; w = (R[7]-R[5])/s; x = s/4; y = (R[1]+R[3])/s; z = (R[2]+R[6])/s; }
    else if (R[4] > R[8]) { const s = Math.sqrt(1 + R[4] - R[0] - R[8]) * 2; w = (R[2]-R[6])/s; x = (R[1]+R[3])/s; y = s/4; z = (R[5]+R[7])/s; }
    else { const s = Math.sqrt(1 + R[8] - R[0] - R[4]) * 2; w = (R[3]-R[1])/s; x = (R[2]+R[6])/s; y = (R[5]+R[7])/s; z = s/4; }
    return [w, x, y, z];
  }

  const ROT_ONLY_DEG = 0.5;   // sotto questa parallasse residua: solo rotazione
  const PX_THRESH = 1.5;      // soglia RANSAC in pixel

  class Odometer {
    constructor(f, cx, cy) { this.f = f; this.cx = cx; this.cy = cy; this.reset(); }

    reset() {
      this.R = [1,0,0, 0,1,0, 0,0,1];   // orientamento camera → mondo
      this.p = [0, 0, 0];               // posizione nel mondo (= prima camera)
      this.step = 1;                    // lunghezza dell'ultimo passo (unità arbitrarie)
      this.dist = 0; this.keyframes = 0;
      this.path = [{ t: 0, p: [0, 0, 0], q: [1, 0, 0, 0] }];
    }

    // kf, cur: pixel dei punti nel keyframe e nel frame corrente [x0,y0,x1,y1,…]
    // depth: profondità note dei punti nel keyframe (NaN se ignota), in unità "mondo"
    process(kf, cur, depth, n, tMs) {
      if (n < 12) return { ok: false };
      const f = this.f, x1 = new Float64Array(2*n), x2 = new Float64Array(2*n);
      for (let i = 0; i < n; i++) {
        x1[2*i] = (kf[2*i] - this.cx) / f;  x1[2*i+1] = (kf[2*i+1] - this.cy) / f;
        x2[2*i] = (cur[2*i] - this.cx) / f; x2[2*i+1] = (cur[2*i+1] - this.cy) / f;
      }
      const thr = PX_THRESH / f;
      const est = ransacE(x1, x2, n, thr*thr, 300);
      if (!est || est.count < Math.max(12, 0.3 * n)) return { ok: false };
      const mask = est.mask;

      // E = [t]×R  →  due rotazioni possibili e t a meno del segno
      const { U, V } = svd3(est.E), Vt = T3(V);
      const W = [0,-1,0, 1,0,0, 0,0,1];
      const Ra = mul3(mul3(U, W), Vt), Rb = mul3(mul3(U, T3(W)), Vt);
      const tu = [U[2], U[5], U[8]];
      const newDepth = new Float64Array(n).fill(NaN);
      const z = [0, 0];

      // Caso 1: rotazione (quasi) pura → aggiorno solo l'orientamento
      const ra = rotResidualDeg(Ra, x1, x2, mask, n), rb = rotResidualDeg(Rb, x1, x2, mask, n);
      if (Math.min(ra, rb) < ROT_ONLY_DEG) {
        const R = ra <= rb ? Ra : Rb;
        for (let i = 0; i < n; i++) if (mask[i] && isFinite(depth[i])) {
          const d = depth[i] * (R[6]*x1[2*i] + R[7]*x1[2*i+1] + R[8]);
          if (d > 0) newDepth[i] = d;
        }
        this.R = mul3(this.R, T3(R));
        this._push(tMs);
        return { ok: true, mode: 'rot', mask, depth: newDepth, inliers: est.count };
      }

      // Caso 2: scelgo la combinazione (R, ±t) che mette i punti davanti a entrambe le camere
      let best = null, bestCnt = -1;
      for (const R of [Ra, Rb]) for (const sg of [1, -1]) {
        const t = [sg*tu[0], sg*tu[1], sg*tu[2]];
        let cnt = 0;
        for (let i = 0; i < n; i++) if (mask[i]) {
          depths(R, t, x1[2*i], x1[2*i+1], x2[2*i], x2[2*i+1], z);
          if (z[0] > 0 && z[1] > 0) cnt++;
        }
        if (cnt > bestCnt) { bestCnt = cnt; best = { R, t }; }
      }
      if (bestCnt < 0.5 * est.count) return { ok: false };
      const { R, t } = best;

      // Scala: confronto le profondità già note con quelle ricalcolate a |t| = 1
      const ratios = [], z1 = new Float64Array(n), z2 = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        z1[i] = z2[i] = NaN;
        if (!mask[i]) continue;
        depths(R, t, x1[2*i], x1[2*i+1], x2[2*i], x2[2*i+1], z);
        if (!(z[0] > 0 && z[1] > 0) || z[0] > 500) { mask[i] = 0; continue; }
        z1[i] = z[0]; z2[i] = z[1];
        if (isFinite(depth[i])) ratios.push(depth[i] / z[0]);
      }
      let s = this.step;
      if (this.keyframes === 0 && ratios.length < 8) s = 1;
      else if (ratios.length >= 8) {
        const m = median(ratios);
        if (isFinite(m) && m > 0) s = Math.min(this.step * 5, Math.max(this.step / 5, m));
      }
      for (let i = 0; i < n; i++) if (mask[i]) newDepth[i] = s * z2[i];

      // Aggiorno la posa: centro della nuova camera = −Rᵀ·t nel riferimento della precedente
      const Rt = T3(R), c = mv(Rt, t), dw = mv(this.R, [-s*c[0], -s*c[1], -s*c[2]]);
      this.p = [this.p[0] + dw[0], this.p[1] + dw[1], this.p[2] + dw[2]];
      this.R = mul3(this.R, Rt);
      this.step = s; this.dist += s;
      this._push(tMs);
      let cnt = 0; for (let i = 0; i < n; i++) cnt += mask[i];
      return { ok: true, mode: 'move', mask, depth: newDepth, inliers: cnt };
    }

    _push(tMs) {
      this.keyframes++;
      if (this.keyframes % 50 === 0) {           // ri-ortonormalizzo ogni tanto
        const r0 = unit([this.R[0], this.R[3], this.R[6]]);
        let r1 = [this.R[1], this.R[4], this.R[7]]; const d = dot(r1, r0);
        r1 = unit([r1[0]-d*r0[0], r1[1]-d*r0[1], r1[2]-d*r0[2]]);
        const r2 = cross(r0, r1);
        this.R = [r0[0],r1[0],r2[0], r0[1],r1[1],r2[1], r0[2],r1[2],r2[2]];
      }
      this.path.push({ t: tMs, p: this.p.slice(), q: quat(this.R) });
      if (this.path.length > 20000) this.path.splice(1, 2);
    }
  }

  return { Odometer, jacobi, svd3, fitE, ransacE, mul3, T3, mv, median };
})();

/* =====================================================================
   2) TRACKER: rileva i punti (Shi-Tomasi) e li segue tra i frame con il
      flusso ottico di Lucas-Kanade, usando OpenCV.js. Quando la parallasse
      rispetto al keyframe è sufficiente, passa le coppie all'Odometer.
   ===================================================================== */
class VOTracker {
  constructor(cv, w, h, fovDeg) {
    this.cv = cv; this.w = w; this.h = h;
    const long = Math.max(w, h);
    const f = long / (2 * Math.tan(fovDeg * Math.PI / 360));   // focale in pixel dal FOV sul lato lungo
    this.odo = new VOCore.Odometer(f, w / 2, h / 2);
    this.MAX = 300; this.MIN_KEEP = 200;
    this.parPx = 0.03 * long;                                  // parallasse (px) che fa scattare un keyframe
    this.n = 0;
    this.kf = new Float32Array(this.MAX * 2);
    this.cur = new Float32Array(this.MAX * 2);
    this.depth = new Float64Array(this.MAX).fill(NaN);
    this.prev = new cv.Mat(); this.hasPrev = false;
    this.mask = new cv.Mat(h, w, cv.CV_8UC1);
    this.win = new cv.Size(21, 21);
    this.crit = new cv.TermCriteria(cv.TERM_CRITERIA_EPS | cv.TERM_CRITERIA_COUNT, 20, 0.03);
    this.last = { mode: 'init', inliers: 0, parallax: 0 };
  }

  dispose() { this.prev.delete(); this.mask.delete(); }

  reset() { this.odo.reset(); this.n = 0; this.hasPrev = false; this.depth.fill(NaN); }

  // gray: cv.Mat CV_8UC1 del frame corrente
  feed(gray, tMs) {
    let info = { mode: 'track', inliers: this.last.inliers, parallax: 0 };
    if (!this.hasPrev || this.n === 0) {
      this.n = 0; this._detect(gray); info.mode = 'init';
    } else {
      this._track(gray);
      const par = this._parallax(); info.parallax = par;
      const low = this.n < 25;
      if (par >= this.parPx || (low && par >= 4)) {
        const r = this.odo.process(this.kf, this.cur, this.depth, this.n, tMs);
        if (r.ok) {
          let m = 0;
          for (let i = 0; i < this.n; i++) if (r.mask[i]) {
            this.cur[2*m] = this.cur[2*i]; this.cur[2*m+1] = this.cur[2*i+1]; this.depth[m] = r.depth[i]; m++;
          }
          this.n = m; info.mode = r.mode; info.inliers = r.inliers;
        } else { this.depth.fill(NaN); info.mode = 'fail'; info.inliers = 0; }
        this.kf.set(this.cur.subarray(0, 2 * this.n));
        if (this.n < this.MIN_KEEP) this._detect(gray);
      } else if (low) {
        this.kf.set(this.cur.subarray(0, 2 * this.n));
        this._detect(gray); info.mode = 'fail';
      }
    }
    gray.copyTo(this.prev); this.hasPrev = true;
    this.last = info;
    return info;
  }

  _detect(gray) {
    const cv = this.cv;
    this.mask.setTo(new cv.Scalar(255));
    for (let i = 0; i < this.n; i++)
      cv.circle(this.mask, new cv.Point(Math.round(this.cur[2*i]), Math.round(this.cur[2*i+1])), 8, new cv.Scalar(0), -1);
    const corners = new cv.Mat();
    cv.goodFeaturesToTrack(gray, corners, this.MAX - this.n, 0.01, 8, this.mask, 3, false, 0.04);
    const d = corners.data32F, add = Math.min(corners.rows, this.MAX - this.n);
    for (let k = 0; k < add; k++) {
      const i = this.n + k;
      this.cur[2*i] = this.kf[2*i] = d[2*k]; this.cur[2*i+1] = this.kf[2*i+1] = d[2*k+1];
      this.depth[i] = NaN;
    }
    this.n += add;
    corners.delete();
  }

  _track(gray) {
    const cv = this.cv, n = this.n;
    const p0 = new cv.Mat(n, 1, cv.CV_32FC2), p1 = new cv.Mat(), st = new cv.Mat(), err = new cv.Mat();
    p0.data32F.set(this.cur.subarray(0, 2 * n));
    cv.calcOpticalFlowPyrLK(this.prev, gray, p0, p1, st, err, this.win, 3, this.crit);
    const q = p1.data32F, s = st.data;
    let m = 0;
    for (let i = 0; i < n; i++) {
      const x = q[2*i], y = q[2*i+1];
      if (!s[i] || !(x >= 2 && y >= 2 && x < this.w - 2 && y < this.h - 2)) continue;
      this.cur[2*m] = x; this.cur[2*m+1] = y;
      this.kf[2*m] = this.kf[2*i]; this.kf[2*m+1] = this.kf[2*i+1];
      this.depth[m] = this.depth[i]; m++;
    }
    this.n = m;
    p0.delete(); p1.delete(); st.delete(); err.delete();
  }

  _parallax() {
    const d = new Float64Array(this.n);
    for (let i = 0; i < this.n; i++) d[i] = Math.hypot(this.cur[2*i] - this.kf[2*i], this.cur[2*i+1] - this.kf[2*i+1]);
    return this.n ? VOCore.median(d) : 0;
  }
}
/*VO-CORE-END*/
</script>

<!-- =====================================================================
     3) INTERFACCIA: camera, ciclo dei frame, disegno.
     ===================================================================== -->
<script>
(() => {
  const OPENCV_URLS = [
    'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js',
    'https://docs.opencv.org/4.10.0/opencv.js',
  ];
  const LONG_SIDE = 480;   // risoluzione di elaborazione (lato lungo, px)

  const $ = id => document.getElementById(id);
  const video = $('video'), view = $('view'), map = $('map'), hud = $('hud'), statusEl = $('status');
  const btnStart = $('btnStart'), btnReset = $('btnReset'), btnCsv = $('btnCsv'), fovIn = $('fov');
  const vctx = view.getContext('2d', { willReadFrequently: true });
  const mctx = map.getContext('2d');

  let cvReady = false, running = false, stream = null, raf = 0, wake = null;
  let tracker = null, rgba = null, gray = null, w = 0, h = 0;
  let fps = 0, lastT = 0, lastVideoT = -1, t0 = 0, viewMode = 'top';

  const setStatus = (txt, cls = '') => { statusEl.textContent = txt; statusEl.className = cls; };

  // ---------- caricamento OpenCV.js (con URL di riserva) ----------
  function loadScript(url) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = url; s.async = true; s.onload = res; s.onerror = () => { s.remove(); rej(new Error(url)); };
      document.head.appendChild(s);
    });
  }
  async function loadOpenCV() {
    let ok = false;
    for (const url of OPENCV_URLS) { try { await loadScript(url); ok = true; break; } catch (e) { /* provo il successivo */ } }
    if (!ok) throw new Error('download fallito');
    // a seconda della build `cv` è una Promise oppure un modulo che si inizializza in seguito
    if (window.cv instanceof Promise) window.cv = await window.cv;
    if (!window.cv.Mat) await new Promise(r => {
      window.cv.onRuntimeInitialized = r;
      const poll = setInterval(() => { if (window.cv.Mat) { clearInterval(poll); r(); } }, 100);
    });
  }
  loadOpenCV().then(() => {
    cvReady = true; btnStart.disabled = false;
    setStatus(window.isSecureContext ? 'Pronto' : 'Serve HTTPS per la camera', window.isSecureContext ? 'ok' : 'warn');
  }).catch(e => setStatus('OpenCV non caricato: ' + e.message, 'bad'));

  // ---------- camera ----------
  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Camera non disponibile (serve HTTPS)', 'bad'); return;
    }
    btnStart.disabled = true; setStatus('Apro la camera…');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
      });
      video.srcObject = stream;
      await video.play();
      if (!video.videoWidth) await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
    } catch (e) {
      setStatus('Camera negata: ' + (e.name || e.message), 'bad'); btnStart.disabled = false; return;
    }
    build();
    running = true; t0 = performance.now(); lastT = t0; lastVideoT = -1;
    btnStart.textContent = 'Ferma'; btnStart.classList.add('stop'); btnStart.disabled = false;
    btnReset.disabled = false; btnCsv.disabled = false;
    try { wake = await navigator.wakeLock.request('screen'); } catch (e) { /* facoltativo */ }
    raf = requestAnimationFrame(loop);
  }

  function stop() {
    running = false; cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; video.srcObject = null;
    if (wake) { wake.release().catch(() => {}); wake = null; }
    btnStart.textContent = 'Avvia camera'; btnStart.classList.remove('stop');
    setStatus('Fermo', '');
  }

  // (ri)crea tracker e buffer alla risoluzione di lavoro
  function build() {
    const k = LONG_SIDE / Math.max(video.videoWidth, video.videoHeight);
    w = Math.round(video.videoWidth * k); h = Math.round(video.videoHeight * k);
    view.width = w; view.height = h;
    if (tracker) tracker.dispose();
    if (rgba) rgba.delete();
    if (gray) gray.delete();
    rgba = new cv.Mat(h, w, cv.CV_8UC4); gray = new cv.Mat(h, w, cv.CV_8UC1);
    const fov = Math.min(120, Math.max(30, parseFloat(fovIn.value) || 65));
    tracker = new VOTracker(cv, w, h, fov);
  }

  // ---------- ciclo principale ----------
  const MODE = { init: ['Inizializzo', 'warn'], track: ['Tracking', 'ok'], move: ['Tracking', 'ok'], rot: ['Tracking · rotazione', 'ok'], fail: ['Tracking perso', 'bad'] };
  let lastMode = 'init', failHold = 0;

  function loop() {
    if (!running) return;
    raf = requestAnimationFrame(loop);
    if (video.readyState < 2 || video.currentTime === lastVideoT) return;
    lastVideoT = video.currentTime;
    if (Math.abs(video.videoWidth / video.videoHeight - w / h) > 0.01) build();   // telefono ruotato

    const now = performance.now();
    vctx.drawImage(video, 0, 0, w, h);
    rgba.data.set(vctx.getImageData(0, 0, w, h).data);
    cv.cvtColor(rgba, gray, cv.COLOR_RGBA2GRAY);
    const info = tracker.feed(gray, Math.round(now - t0));

    // punti seguiti: verde = profondità stimata, ambra = nuovi
    vctx.lineWidth = 1;
    for (let i = 0; i < tracker.n; i++) {
      const x = tracker.cur[2*i], y = tracker.cur[2*i+1], known = isFinite(tracker.depth[i]);
      vctx.strokeStyle = vctx.fillStyle = known ? '#6ee7a8' : '#ffb454';
      vctx.beginPath(); vctx.moveTo(tracker.kf[2*i], tracker.kf[2*i+1]); vctx.lineTo(x, y); vctx.stroke();
      vctx.fillRect(x - 1.5, y - 1.5, 3, 3);
    }

    fps = fps ? fps * 0.9 + 100 / (now - lastT) : 1000 / (now - lastT); lastT = now;
    if (info.mode === 'fail') failHold = 20; else if (failHold > 0) failHold--;
    if (info.mode !== 'track') lastMode = info.mode;
    const [txt, cls] = MODE[failHold > 0 ? 'fail' : lastMode] || MODE.track;
    setStatus(txt, cls);
    hud.textContent = `${fps.toFixed(0)} fps  ${w}×${h}\npunti ${tracker.n}  inlier ${info.inliers}\nparallasse ${info.parallax.toFixed(1)} px`;

    const o = tracker.odo;
    $('sx').textContent = o.p[0].toFixed(2); $('sy').textContent = o.p[1].toFixed(2); $('sz').textContent = o.p[2].toFixed(2);
    $('sd').textContent = o.dist.toFixed(2); $('sk').textContent = o.keyframes;
    drawMap();
  }

  // ---------- traiettoria ----------
  function drawMap() {
    const dpr = window.devicePixelRatio || 1, W = map.clientWidth, H = map.clientHeight;
    if (map.width !== Math.round(W * dpr) || map.height !== Math.round(H * dpr)) { map.width = Math.round(W * dpr); map.height = Math.round(H * dpr); }
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mctx.clearRect(0, 0, W, H);
    const path = tracker ? tracker.odo.path : [{ p: [0, 0, 0] }];
    // dall'alto: X a destra, Z (avanti) in su — di lato: Z a destra, −Y (alto) in su
    const proj = viewMode === 'top' ? p => [p[0], p[2]] : p => [p[2], -p[1]];
    let x0 = -1, x1 = 1, y0 = -1, y1 = 1;
    for (const k of path) { const [a, b] = proj(k.p); if (a < x0) x0 = a; if (a > x1) x1 = a; if (b < y0) y0 = b; if (b > y1) y1 = b; }
    const pad = 28, sc = Math.min((W - 2*pad) / (x1 - x0), (H - 2*pad) / (y1 - y0));
    const ox = W / 2 - sc * (x0 + x1) / 2, oy = H / 2 + sc * (y0 + y1) / 2;
    const X = a => ox + sc * a, Y = b => oy - sc * b;

    // griglia con passo "tondo"
    const raw = Math.max(x1 - x0, y1 - y0) / 6, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const stepG = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
    mctx.strokeStyle = '#1b2633'; mctx.lineWidth = 1; mctx.beginPath();
    for (let g = Math.ceil((0 - ox) / sc / stepG) * stepG; X(g) < W; g += stepG) { mctx.moveTo(X(g), 0); mctx.lineTo(X(g), H); }
    for (let g = Math.ceil((oy - H) / sc / stepG) * stepG; Y(g) > 0; g += stepG) { mctx.moveTo(0, Y(g)); mctx.lineTo(W, Y(g)); }
    mctx.stroke();
    mctx.fillStyle = '#7d90a5'; mctx.font = '11px ui-monospace, Menlo, monospace';
    mctx.fillText('griglia ' + (+stepG.toPrecision(2)) + ' u', 10, H - 10);

    // percorso
    mctx.strokeStyle = '#6ee7a8'; mctx.lineWidth = 2; mctx.lineJoin = 'round'; mctx.beginPath();
    path.forEach((k, i) => { const [a, b] = proj(k.p); i ? mctx.lineTo(X(a), Y(b)) : mctx.moveTo(X(a), Y(b)); });
    mctx.stroke();
    // partenza
    mctx.strokeStyle = '#7d90a5'; mctx.lineWidth = 1.5; mctx.beginPath(); mctx.arc(X(0), Y(0), 5, 0, 2 * Math.PI); mctx.stroke();
    // posizione attuale + direzione di vista
    const cur = path[path.length - 1].p, [ca, cb] = proj(cur);
    const R = tracker ? tracker.odo.R : [1,0,0,0,1,0,0,0,1];
    const [fa, fb] = proj([R[2], R[5], R[8]]), fl = Math.hypot(fa, fb) || 1;
    mctx.strokeStyle = '#ffb454'; mctx.lineWidth = 2; mctx.beginPath();
    mctx.moveTo(X(ca), Y(cb)); mctx.lineTo(X(ca) + 18 * fa / fl, Y(cb) - 18 * fb / fl); mctx.stroke();
    mctx.fillStyle = '#ffb454'; mctx.beginPath(); mctx.arc(X(ca), Y(cb), 4, 0, 2 * Math.PI); mctx.fill();
  }

  // ---------- comandi ----------
  btnStart.addEventListener('click', () => running ? stop() : start());
  btnReset.addEventListener('click', () => { if (tracker) { if (running) build(); else tracker.reset(); drawMap(); t0 = performance.now(); } });
  fovIn.addEventListener('change', () => { if (running) build(); });
  btnCsv.addEventListener('click', () => {
    if (!tracker) return;
    const rows = ['t_ms,x,y,z,qw,qx,qy,qz'];
    for (const k of tracker.odo.path) rows.push([k.t, ...k.p.map(v => v.toFixed(5)), ...k.q.map(v => v.toFixed(6))].join(','));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.join('\n') + '\n'], { type: 'text/csv' }));
    a.download = 'traiettoria_vo.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  const setView = m => {
    viewMode = m; $('vTop').classList.toggle('on', m === 'top'); $('vSide').classList.toggle('on', m === 'side');
    $('mapLabel').textContent = m === 'top' ? "Traiettoria · dall'alto (X–Z)" : 'Traiettoria · di lato (Z–Y)';
    drawMap();
  };
  $('vTop').addEventListener('click', () => setView('top'));
  $('vSide').addEventListener('click', () => setView('side'));
  window.addEventListener('resize', drawMap);
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) stop(); });
  drawMap();
})();
</script>
</body>
